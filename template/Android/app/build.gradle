apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "TEMPLATE_UUID"
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions { 
         checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation project(path: ':classes')
}

task copyAssets(type: Copy) {
    println "I'm copyAssets task!"
    from "../../Assets"
    into "src/main/assets"
}

task deleteIOSFolder(type: Delete) {
  delete 'src/main/assets/Data/DotNet/ios'
}

task copyDotNetAssets(type: Copy) {
    println "I'm copyDotNetAssets task! , skipped for .NET 6.x"
    // from("../../libs/dotnet/urho/mobile") {
    //     include "android/UrhoDotNet.dll"
    //     include "android/Mono.Android.dll"
    // }
    // into "src/main/assets/Data/DotNet"
}


task dotnetBuildRelease {
    exec {
        println "I'm dotnetBuildRelease task!"
        workingDir '../../'
        commandLine 'dotnet','build','--configuration','Release','-p:DefineConstants=_MOBILE_'
    }
    
}

task dotnetBuildDebug {
    exec {
        println "I'm dotnetBuildDebug task!"
        workingDir '../../'
        commandLine 'dotnet','build','--configuration','Debug','-p:DefineConstants=_MOBILE_'
    }
}

task dotnetResolveReferences {
    mustRunAfter("dotnetBuildDebug",'dotnetBuildRelease')
    exec {
        println "I'm dotnetResolveReferences arm64-v8a task!"
        assert file("./src/main/assets/Data/DotNet/Game.dll").exists() 
        commandLine 'dotnet','../../tools/ReferenceAssemblyResolver/ReferenceAssemblyResolver.dll','--assembly','./src/main/assets/Data/DotNet/Game.dll' , '--output', 'src/main/assets/Data/DotNet/android/arm64-v8a' , '--search' , '../../libs/dotnet/urho/mobile/android,../../libs/dotnet/bcl/android/arm64-v8a'
    }
    exec {
        println "I'm dotnetResolveReferences armeabi-v7a task!"
        assert file("./src/main/assets/Data/DotNet/Game.dll").exists() 
        commandLine 'dotnet','../../tools/ReferenceAssemblyResolver/ReferenceAssemblyResolver.dll','--assembly','./src/main/assets/Data/DotNet/Game.dll' , '--output', 'src/main/assets/Data/DotNet/android/armeabi-v7a' , '--search' , '../../libs/dotnet/urho/mobile/android,../../libs/dotnet/bcl/android/armeabi-v7a'
    }
    exec {
        println "I'm dotnetResolveReferences x86 task!"
        assert file("./src/main/assets/Data/DotNet/Game.dll").exists() 
        commandLine 'dotnet','../../tools/ReferenceAssemblyResolver/ReferenceAssemblyResolver.dll','--assembly','./src/main/assets/Data/DotNet/Game.dll' , '--output', 'src/main/assets/Data/DotNet/android/x86' , '--search' , '../../libs/dotnet/urho/mobile/android,../../libs/dotnet/bcl/android/x86'
    }
    exec {
        println "I'm dotnetResolveReferences x86_64 task!"
        assert file("./src/main/assets/Data/DotNet/Game.dll").exists() 
        commandLine 'dotnet','../../tools/ReferenceAssemblyResolver/ReferenceAssemblyResolver.dll','--assembly','./src/main/assets/Data/DotNet/Game.dll' , '--output', 'src/main/assets/Data/DotNet/android/x86_64' , '--search' , '../../libs/dotnet/urho/mobile/android,../../libs/dotnet/bcl/android/x86_64'
    }
}



task dotnetDebug {
    println "I'm dotnetDebug task!"
    mustRunAfter("copyAssets",'deleteIOSFolder','copyDotNetAssets','dotnetBuildDebug','dotnetResolveReferences')
    dependsOn('copyAssets','deleteIOSFolder','copyDotNetAssets','dotnetBuildDebug','dotnetResolveReferences','assembleDebug')
}

task dotnetRelease {
    println "I'm dotnetRelease task!"
    mustRunAfter("copyAssets",'deleteIOSFolder','copyDotNetAssets','dotnetBuildRelease','dotnetResolveReferences')
    dependsOn('copyAssets','deleteIOSFolder','copyDotNetAssets','dotnetBuildRelease','dotnetResolveReferences','assembleRelease')
}